version: 2
sources:
  - name: raw
    schema: raw
    tables:
      - name: speeches
        columns:
          - name: speech_id
            data_tests: [unique, not_null]
      - name: chunks
        columns:
          - name: chunk_id
            data_tests: [unique, not_null]
          - name: speech_id
            data_tests:
              - relationships:
                  arguments: {to: "source('raw', 'speeches')", field: speech_id}
      - name: topics
      - name: words
      - name: mentions
      - name: similarities
      - name: budget_frames
      - name: votes
        columns:
          - name: vote_id
            data_tests: [not_null]
      - name: decisions
        columns:
          - name: vote_id
            data_tests: [unique, not_null]
      - name: decision_motions
      - name: decision_speech_links
      - name: committee_points
        columns:
          - name: point_id
            data_tests: [unique, not_null]
      - name: decision_citations
      - name: decision_reservations
      - name: policy_documents
        columns:
          - name: document_id
            data_tests: [unique, not_null]
      - name: budget_outturn_appropriations
      - name: sfs_provisions
        columns:
          - name: provision_id
            data_tests: [unique, not_null]
