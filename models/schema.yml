version: 2
models:
  - name: stg_speeches
    description: "Källmetadata; FP→L och KDS→KD. Namn normaliseras separat eftersom historiska person-ID:n kan vara felaktiga."
    columns:
      - name: speech_id
        data_tests: [unique, not_null]
      - name: speech_date
        data_tests: [not_null]
  - name: int_segments
    description: "Icke överlappande textsegment, högst 120 modelltoken. En ämnesetikett per segment."
    columns:
      - name: chunk_id
        data_tests: [unique, not_null]
      - name: topic_id
        data_tests:
          - relationships:
              arguments: {to: "source('raw','topics')", field: topic_id}
  - name: mart_topics
    description: "Ämnen som andel av segmentens ord, inklusive ej grupperade."
  - name: mart_topic_trends
    description: "Ämnesandel per parti/riksmöte; inte ett mått på ståndpunkt eller talartid."
  - name: mart_word_usage
    description: "Ordfrekvens per 1000 ord samt logaritmisk frekvenskvot mot övriga partier. Ordformer, inte lemmor."
  - name: mart_mentions
    description: "Konservativa namn- och partiomnämnanden; inte automatiskt kritik eller replikrelationer."
  - name: gold_topic_summary
    description: "Liten, publiceringsklar ämnesöversikt för portfolio."
    columns:
      - name: topic_id
        data_tests: [unique, not_null]
  - name: gold_topic_by_session_party
    description: "Publiceringsklara ämnesandelar per riksmöte och parti."
  - name: gold_party_words
    description: "De 50 vanligaste och 50 mest särskiljande orden per parti."
  - name: gold_mentions
    description: "De 200 största omnämnandekopplingarna per talarparti."
  - name: gold_speakers
    description: "Talare med textmängd och datumintervall."
  - name: gold_similar_speeches
    description: "De 500 mest lika talen över partigränser med korta utdrag."
  - name: gold_umap_points
    description: "Deterministiskt urval, högst 400 UMAP-punkter per riksmöte."
    columns:
      - name: chunk_id
        data_tests: [unique, not_null]
  - name: stg_budget_frames
    description: "Regeringens och partiernas föreslagna utgiftsramar från FiU1. Belopp anges i miljoner kronor."
    columns:
      - name: session
        data_tests: [not_null]
      - name: expenditure_area
        data_tests: [not_null]
      - name: actor
        data_tests: [not_null]
  - name: gold_budget_frames
    description: "Publiceringsklara budgetramar och budgetandelar per riksmöte, aktör och utgiftsområde."
    columns:
      - name: source_url
        data_tests: [not_null]
  - name: mart_budget_speech_alignment
    description: "Lexikal uppmärksamhet i partiledardebatter jämförd med föreslagen budgetandel. Nyckelorden är en transparent proxy, inte ett mått på politiskt stöd."
  - name: gold_budget_speech_alignment
    description: "Webbklart jämförelseunderlag mellan partiernas budgetmotioner och vad de talar om."
  - name: stg_votes
    description: "Varje registrerad ledamotsröst, inklusive avstående och frånvaro. Parti kodas om historiskt; originalet sparas."
  - name: stg_decisions
    description: "Voterade punkter i utskottsbetänkanden med källänkad rubrik, text och utfall."
    columns:
      - name: vote_id
        data_tests: [unique, not_null]
  - name: gold_party_vote_decisions
    description: "Röster per parti och beslutspunkt. Partiposition är registrerad majoritet inom partiet, inte partiledarens personliga röst eller automatisk inställning till varje motion."
    columns:
      - name: vote_id
        data_tests: [not_null]
      - name: source_url
        data_tests: [not_null]
  - name: gold_decision_speech_links
    description: "Ett föregående tal från samma parti med hög textlikhet till beslutets titel och punkt. Talarens egen registrerade röst anges när person-ID matchar. Textlikheten mäter enbart tematisk närhet, aldrig stöd eller motsägelse."
    columns:
      - name: vote_id
        data_tests: [not_null]
  - name: stg_committee_points
    description: "Samtliga beslutspunkter i importerade betänkanden, även utan registrerat namnupprop."
  - name: gold_decision_points
    description: "Publiceringsklara beslutspunkter med antal explicita dokumentlänkar och reservationer."
    columns:
      - name: point_id
        data_tests: [unique, not_null]
  - name: gold_decision_citations
    description: "Uttryckliga motion-/propositionshänvisningar i punktens förslag; numrerat yrkande när det står i texten. Ingen härledd partiståndpunkt."
    columns:
      - name: point_id
        data_tests:
          - relationships:
              arguments: {to: "ref('gold_decision_points')", field: point_id}
  - name: gold_decision_reservations
    description: "Registrerade motförslag/reservationer per beslutspunkt och parti; är inte liktydiga med personlig röst."
    columns:
      - name: point_id
        data_tests:
          - relationships:
              arguments: {to: "ref('gold_decision_points')", field: point_id}
  - name: gold_policy_documents
    description: "Propositioner, skriftliga frågor och interpellationer per riksmöte med källänk."
    columns:
      - name: document_id
        data_tests: [unique, not_null]
  - name: gold_budget_outturn_areas
    description: "Statskontorets beslutade budget, ändringsbudget och utfall per år och utgiftsområde i miljoner kronor."
    columns:
      - name: budget_year
        data_tests: [not_null]
  - name: gold_budget_execution
    description: "FiU1-förslag jämfört med beslutad budget och faktiskt utfall. Differensen är beskrivande, inte ett effektmått."
  - name: gold_debate_decision_traces
    description: "Tematiskt liknande tal med direkt källbelagd beslutspunkt, citationsantal, reservationer och registrerad röst. Ingen automatisk konsistensbedömning."
    columns:
      - name: point_id
        data_tests: [not_null]
  - name: gold_party_activity_summary
    description: "Antal debattal, skriftliga frågor och interpellationer per parti/riksmöte; jämför aktivitet, inte sakpolitisk samsyn."
